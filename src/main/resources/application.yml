spring:
  config:
    # This tells Spring to load the .env file and parse it like a properties file
    import: optional:file:.env[.properties]
  application:
    name: modelflux
  datasource:

    url: jdbc:postgresql://localhost:5432/modelflux
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

groq:
  api:
    key: ${GROQ_API_KEY}
    url: https://api.groq.com/openai/v1/chat/completions
  model: openai/gpt-oss-20b